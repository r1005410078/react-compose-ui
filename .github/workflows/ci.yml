name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      # 只构建示例应用及其依赖：验收只需要它，全量构建会被不相干的包（如 Storybook）拖垮。
      - name: Build
        run: bunx turbo run build --filter=@compose-ui/example...
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: End-to-end test
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Qt 验收链路：预览一侧截参考图并导出 QML，Qt 一侧截导出结果，再比较。
  # 不依赖 verify：Qt 验收与单元测试互不相关，挂在它后面的话，任何一条不相干的单测失败都会让
  # 这条链路永远跑不到（曾经就是这样）。代价是这里自己再构建一次。
  # 渲染环境固定为 xvfb + xcb + Mesa llvmpipe：软件 GL 是确定性的，而且与真机走的是同一条
  # 场景图光栅化路径（QPainter 的 software 后端不是）。
  qt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # 运行库供截图；GL / xkbcommon 的开发包供 `find_package(Qt6 Gui)` 链接（缺了报 WrapOpenGL not found）。
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libegl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 \
            libgl1-mesa-dev libegl-dev libglx-dev libxkbcommon-dev
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: native/qt/.qt
          key: qt-${{ runner.os }}-${{ hashFiles('native/qt/qt-version.json', 'native/qt/scripts/install-qt.sh') }}
      - name: Install Qt
        run: native/qt/scripts/install-qt.sh
      # 只构建示例应用及其依赖：验收只需要它，全量构建会被不相干的包（如 Storybook）拖垮。
      - name: Build
        run: bunx turbo run build --filter=@compose-ui/example...
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Preview reference screenshots and QML export
        run: bunx playwright test e2e/qt-reference.spec.ts
      - name: Grab Qt screenshots
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" native/qt/scripts/grab-fixtures.sh
      # 截图必须是确定的：同一份 QML 连截十次画面逐像素一致，否则容差兜的是随机噪声而不是两套光栅化的差异。
      - name: Grab determinism
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          fonts=(); for f in native/qt/fixtures/fonts/*.ttf; do fonts+=(--font "$f"); done
          mkdir -p native/qt/out/determinism
          status=0
          for name in text-styles instances; do
            for i in $(seq 10); do
              xvfb-run -a -s "-screen 0 1280x1024x24" native/qt/build/tools/qml-grab/qml-grab \
                "native/qt/out/export/$name.qml" "native/qt/out/determinism/$name-$i.png" "${fonts[@]}"
            done
            echo "== $name"
            bun scripts/qt/check-determinism.ts native/qt/out/determinism/$name-*.png || status=1
          done
          exit $status
      - name: Compare with preview
        run: bun scripts/qt/compare-render.ts
      - name: Upload Qt comparison output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: qt-comparison
          path: native/qt/out/
          retention-days: 14
